name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  schedule:
    # Weekly: new advisories appear without any code change.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.12"

      - name: Install dependencies (hash-checked)
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install "pytest==9.1.1"

      - name: Lint (dead code, import placement, import sorting)
        run: |
          python -m pip install "ruff==0.16.5"
          # Every rule configured in pyproject.toml, so the gate matches the
          # config instead of a subset of it.
          python -m ruff check src tests

      - name: No f-strings
        run: |
          # Project convention: .format()/%-formatting and named template
          # classes instead of f-strings, so messages stay greppable and log
          # calls stay lazy. Keep this gate green rather than adding exceptions.
          # AST-based: a grep for `f"` misses f'...', f'''...''' and friends,
          # so the gate would pass while prohibited code remained.
          python scripts/check_no_fstrings.py src tests

      - name: Run tests
        run: python -m pytest tests -q

  # The gateway config is only exercised when a deploy restarts nginx, so a config
  # error reaches production before anyone sees it — a duplicate real_ip_header
  # did exactly that. `nginx -t` in the image the stack actually runs catches it
  # at PR time instead.
  gateway-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the gateway config in nginx
        working-directory: deployment
        run: |
          set -euo pipefail

          # The 443 server block needs a cert pair present to load at all; the
          # contents are irrelevant to a config test.
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=ci" \
            -keyout certs/origin.key -out certs/origin.pem 2>/dev/null

          # Validate twice: the committed snippet, and the one a deploy generates.
          # The duplicate directive lived in the generator, so checking only the
          # committed file would have missed it.
          for stage in committed generated; do
            if [ "$stage" = generated ]; then
              # Generated from committed fixtures, not from cloudflare.com: the
              # updater exits 0 and keeps the committed file when a download
              # fails, which would quietly turn this into a second run of the
              # `committed` case while the log still claimed generated coverage.
              CLOUDFLARE_IPS_V4_URL="file://$PWD/nginx/testdata/cloudflare-ips-v4" \
              CLOUDFLARE_IPS_V6_URL="file://$PWD/nginx/testdata/cloudflare-ips-v6" \
                bash nginx/update-cloudflare-ips.sh

              # Prove generation happened. 192.0.2.0/24 is RFC 5737
              # documentation space and only ever appears in the fixtures, so its
              # presence cannot come from the committed snippet.
              if ! grep -q '^set_real_ip_from 192\.0\.2\.0/24;$' nginx/cloudflare-ips.conf \
                 || ! grep -q '^# Generated by update-cloudflare-ips.sh' nginx/cloudflare-ips.conf; then
                echo "::error::cloudflare-ips.conf was not regenerated — the generated config is untested."
                exit 1
              fi
            fi

            # COPY rather than bind-mount, so the test does not depend on the
            # runner's mount behaviour.
            cat > Dockerfile.nginx-test <<'DOCKER'
          FROM nginx:1.27-alpine
          COPY nginx-docker.conf /etc/nginx/conf.d/default.conf
          COPY nginx/cloudflare-ips.conf /etc/nginx/snippets/cloudflare-ips.conf
          COPY nginx/origin-lock.conf /etc/nginx/snippets/origin-lock.conf
          COPY certs /etc/nginx/certs
          DOCKER
            docker build -q -f Dockerfile.nginx-test -t lux-gateway-test . >/dev/null

            echo "::group::nginx -t ($stage cloudflare-ips.conf)"
            # Upstream names are resolved at config load; map them to something
            # that resolves so the test checks the config, not DNS.
            docker run --rm --add-host server-lux:127.0.0.1 lux-gateway-test nginx -t
            echo "::endgroup::"
          done

          # The local stack mounts origin-lock.off.conf in place of the real one;
          # it must stay loadable too.
          cp nginx/origin-lock.off.conf nginx/origin-lock.conf
          docker build -q -f Dockerfile.nginx-test -t lux-gateway-test . >/dev/null
          echo "::group::nginx -t (origin lock disabled)"
          docker run --rm --add-host server-lux:127.0.0.1 lux-gateway-test nginx -t
          echo "::endgroup::"

  # The log agent's config is only exercised when a deploy starts it, so a
  # syntax error would first surface with the agent crash-looping and no logs
  # arriving — the one moment the records are wanted. Same argument as the
  # gateway config above, same remedy: check it at PR time, in the image the
  # stack actually runs.
  agent-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the Alloy config
        working-directory: deployment
        run: |
          set -euo pipefail

          # Read the tag from the compose file so the two cannot drift.
          image="$(grep -oE 'grafana/alloy:[^[:space:]]+' docker-compose.scaleway.yml | head -1)"
          echo "Validating against $image"

          mount="$PWD/alloy/config.alloy:/c.alloy:ro"

          echo "::group::alloy fmt"
          docker run --rm -v "$mount" --entrypoint alloy "$image" fmt /c.alloy > /dev/null
          echo "::endgroup::"

          # `validate` loads every component, so it catches what fmt cannot:
          # unknown components, bad references, wrong argument names. It is
          # newer than fmt, so fall back rather than fail on an older image.
          if docker run --rm --entrypoint alloy "$image" validate --help >/dev/null 2>&1; then
            echo "::group::alloy validate"
            # The endpoint and token come from the environment. The values are
            # irrelevant to a config check, but an empty URL would fail for the
            # wrong reason.
            docker run --rm -v "$mount" \
              -e COCKPIT_LOKI_URL=https://ci.invalid/loki/api/v1/push \
              -e COCKPIT_TOKEN=ci-not-a-real-token \
              --entrypoint alloy "$image" validate /c.alloy
            echo "::endgroup::"
          else
            echo "::warning::alloy validate is unavailable in $image — fmt only"
          fi

      - name: Resolve the compose file in every profile state
        working-directory: deployment
        run: |
          set -euo pipefail

          # Compose interpolates the WHOLE file before it applies profiles, so a
          # required-variable guard (${VAR:?...}) on an optional service breaks
          # every deploy — including the ones that never start that service.
          # That regression is invisible until a deploy runs, so pin all three
          # states the stack is deployed in.
          base="AUTH_TYPE=none MODEL_SERVICE_URL=x MODAL_KEY=x MODAL_SECRET=x"
          base="$base OBSTRUCTION_SERVICE_URL=x OBSTRUCTION_TOKEN=x"

          resolve() {
            env $base "$@" docker compose -f docker-compose.scaleway.yml \
              --env-file /dev/null config --services | sort | tr '\n' ' '
          }

          echo "::group::profiles resolved"
          off="$(resolve)"
          on="$(resolve COMPOSE_PROFILES=cockpit \
                        COCKPIT_LOKI_URL=https://ci.invalid/loki/api/v1/push \
                        COCKPIT_TOKEN=ci)"
          bare="$(resolve COMPOSE_PROFILES=cockpit)"
          echo "off:  $off"
          echo "on:   $on"
          echo "bare: $bare"
          echo "::endgroup::"

          grep -q alloy <<< "$off" && { echo "::error::alloy resolves with the profile off"; exit 1; }
          grep -q alloy <<< "$on" || { echo "::error::alloy missing with the profile on"; exit 1; }
          grep -q alloy <<< "$bare" || { echo "::error::profile on without values must still resolve"; exit 1; }
          echo "All three profile states resolve as expected."

  # The deploy workflow and script only run when something is actually being
  # deployed, so a YAML or bash syntax error would otherwise surface for the
  # first time with production down. Parse both on every push instead.
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.12"

      - name: Parse deploy-scaleway.yml as YAML
        run: |
          # Not in requirements.txt (app deps, hash-checked): a version pin in
          # the same style as the other CI tool installs (ruff, pip-audit).
          python -m pip install "pyyaml==6.0.2"
          python -c "import yaml,sys; yaml.safe_load(open('.github/workflows/deploy-scaleway.yml')); yaml.safe_load(open('.github/workflows/ci.yml'))"

      - name: bash -n the deploy script
        run: bash -n deployment/deploy-scaleway.sh

      - name: Deploy script behaviour tests (mocked docker/git)
        run: bash deployment/tests/test-deploy-scaleway.sh

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.12"

      - name: Audit locked dependencies
        run: |
          python -m pip install "pip-audit==2.10.1"
          pip-audit --requirement requirements.txt --disable-pip --strict
