name: Deploy to Scaleway

# CI-driven deploy of the Scaleway stack (Docker Compose on a single CPU Instance).
#
# Secrets live in GitHub Secrets (the single source of truth) — never in the repo
# and never edited by hand on the box. This workflow renders them into a runtime
# env file on the runner, copies it to the instance, and runs deploy-scaleway.sh
# over SSH. The app is unchanged: it still reads the values from its environment.
#
# Required GitHub configuration (Settings → Secrets and variables → Actions):
#   Secrets:   MODAL_KEY, MODAL_SECRET, SCALEWAY_SSH_KEY (private key authorized
#              on the instance), OBSTRUCTION_TOKEN (invocation token for the private
#              obstruction Scaleway container). Optional: API_TOKEN (only when
#              AUTH_TYPE=token); SCW_ACCESS_KEY / SCW_SECRET_KEY (only for a private
#              bucket/registry workflow — the default compose stack does not use them).
#   Variables: SCALEWAY_HOST, SCALEWAY_USER, DEPLOY_PATH (server_lux checkout on
#              the box), MODEL_SERVICE_URL, OBSTRUCTION_SERVICE_URL (public
#              *.scw.cloud endpoint). Optional: DEPLOY_REF (default master),
#              AUTH0_DOMAIN + AUTH0_AUDIENCE (required when AUTH_TYPE=auth0;
#              public identifiers, not secrets), CORS_ORIGINS.
#              Required: AUTH_TYPE (auth0|token|none), SSH_KNOWN_HOSTS (pinned
#              host key, output of `ssh-keyscan <host>`).
#
# One trigger, two callers:
#   - A human, from the Actions tab. Optionally targets one service
#     (encoder/merger/stats) instead of redeploying the whole stack.
#   - A microservice repo's own workflow, when it pushes a tag: it calls
#     POST /repos/.../actions/workflows/deploy-scaleway.yml/dispatches with
#     inputs {service, service_ref}, so a tag on e.g. server_encoder redeploys
#     ONLY that service, pinned to that tag. The deploy key and this logic stay
#     in this one repo instead of being copied into each service repo and
#     rotated in four places.
#
# workflow_dispatch rather than repository_dispatch deliberately: the
# workflow-dispatch endpoint needs only **Actions: write** on this repo, while
# repository_dispatch sits under **Contents: write** — which would also let the
# sender push code here. Same capability, a token that cannot modify the
# repository. (A different repo's default GITHUB_TOKEN cannot dispatch either
# way; the sender authenticates with its own token.)
#
# `service_ref`, not `ref`: the dispatch API already takes a `ref` naming which
# branch of THIS repo to run the workflow from. This input is the ref of the
# SERVICE's repo to deploy, and the two are unrelated.

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Force rebuild of all images"
        type: boolean
        default: false
      service:
        description: "Restart only this service (empty = full stack)"
        type: choice
        default: ""
        options:
          - ""
          - encoder
          - merger
          - stats
      service_ref:
        description: "Pin that service to this branch/tag (empty = leave as-is)"
        type: string
        default: ""

# Never run two deploys against the same box at once.
concurrency:
  group: deploy-scaleway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Scopes the secrets to this environment and allows required-reviewer gating.
    environment: prod
    steps:
      - name: Resolve the target service and the per-service refs
        id: target
        env:
          INPUT_SERVICE: ${{ inputs.service }}
          INPUT_SERVICE_REF: ${{ inputs.service_ref }}
          # Durable per-service pins. These are the source of truth a deploy
          # starts from; a tag deploy overrides only its own service, for its
          # own run. Unset is fine — deploy-scaleway.sh then falls back to what
          # the box last deployed, and only then to master.
          VAR_ENCODER_REF: ${{ vars.ENCODER_REF }}
          VAR_MERGER_REF: ${{ vars.MERGER_REF }}
          VAR_STATS_REF: ${{ vars.STATS_REF }}
        run: |
          set -euo pipefail
          short="$INPUT_SERVICE"
          ref="$INPUT_SERVICE_REF"

          # A supplied service_ref is the signature of a tag deploy: new code
          # exists for exactly one service, so force its rebuild. A manual run
          # that leaves it empty redeploys whatever the pins already resolve to
          # and respects the `build` checkbox.
          force_build=false
          [ -n "$ref" ] && force_build=true

          # Pinning a ref only means something for one named service. Allowing
          # it without a service would silently widen a tag deploy into a
          # forced full-stack rebuild.
          if [ -n "$ref" ] && [ -z "$short" ]; then
            echo "::error::service_ref was given without a service — name the service to pin (encoder, merger or stats)."
            exit 1
          fi

          compose_service=""; ref_var=""
          case "$short" in
            "") ;;
            encoder|merger|stats)
              compose_service="${short}-service"
              ref_var="$(echo "$short" | tr '[:lower:]' '[:upper:]')_REF" ;;
            *) echo "::error::Unknown service '$short' — expected encoder, merger or stats."; exit 1 ;;
          esac

          # validate_ref <value> <name>: every ref below is emitted to
          # $GITHUB_OUTPUT, written into .env.scaleway and `source`d by
          # deploy-scaleway.sh on the VM — a value like '$(curl … | sh)' or one
          # containing a newline would execute as shell there, or inject extra
          # env assignments. Restrict every ref to what git branch/tag names
          # actually need before it is written anywhere. This covers the
          # dispatch payload AND the ENCODER_REF/MERGER_REF/STATS_REF GitHub
          # Variables: a Variable is admin-controlled, but it reaches the same
          # sourced file, so it gets the same treatment rather than trust.
          validate_ref() {
            local value="$1" name="$2"
            case "$value" in
              *[!A-Za-z0-9._/-]*)
                echo "::error::${name} '${value}' contains characters outside [A-Za-z0-9._/-]."
                exit 1 ;;
            esac
            case "$value" in
              -*|/*|*/|*..*|*.lock)
                echo "::error::${name} '${value}' is not a well-formed branch or tag name."
                exit 1 ;;
            esac
            if [ "${#value}" -gt 200 ]; then
              echo "::error::${name} is longer than 200 characters."
              exit 1
            fi
          }

          [ -n "$ref" ] && validate_ref "$ref" "service_ref input"

          # Render all three pins every run, overriding only the targeted one.
          # Emitting just the dispatch's ref would drop the other two services'
          # pins from the rebuilt .env.scaleway on the box.
          encoder_ref="$VAR_ENCODER_REF"
          merger_ref="$VAR_MERGER_REF"
          stats_ref="$VAR_STATS_REF"
          case "$short" in
            encoder) [ -n "$ref" ] && encoder_ref="$ref" ;;
            merger)  [ -n "$ref" ] && merger_ref="$ref" ;;
            stats)   [ -n "$ref" ] && stats_ref="$ref" ;;
          esac
          # The dispatch ref is validated above; these checks are what guard
          # the three GitHub Variable values.
          [ -n "$encoder_ref" ] && validate_ref "$encoder_ref" "ENCODER_REF variable"
          [ -n "$merger_ref" ] && validate_ref "$merger_ref" "MERGER_REF variable"
          [ -n "$stats_ref" ] && validate_ref "$stats_ref" "STATS_REF variable"

          {
            echo "compose_service=$compose_service"
            echo "ref_var=$ref_var"
            echo "ref=$ref"
            echo "encoder_ref=$encoder_ref"
            echo "merger_ref=$merger_ref"
            echo "stats_ref=$stats_ref"
            echo "force_build=$force_build"
          } >> "$GITHUB_OUTPUT"
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SCALEWAY_SSH_KEY }}
          HOST: ${{ vars.SCALEWAY_HOST }}
          KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key only: a live ssh-keyscan trusts whatever key answers,
          # so a MITM could receive the deploy key and the runtime secrets.
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::SSH_KNOWN_HOSTS variable is not set — pin the host key (output of \`ssh-keyscan <host>\`)."
            exit 1
          fi
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Render runtime env from GitHub Secrets
        env:
          MODEL_SERVICE_URL: ${{ vars.MODEL_SERVICE_URL }}
          AUTH_TYPE: ${{ vars.AUTH_TYPE }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          # Auth0 identifiers are public (not secrets) → GitHub Variables.
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
          MODAL_KEY: ${{ secrets.MODAL_KEY }}
          MODAL_SECRET: ${{ secrets.MODAL_SECRET }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          # Off-box obstruction on a private Scaleway container: the URL is a public
          # identifier (Variable), the invocation token is a per-service Secret.
          OBSTRUCTION_SERVICE_URL: ${{ vars.OBSTRUCTION_SERVICE_URL }}
          OBSTRUCTION_TOKEN: ${{ secrets.OBSTRUCTION_TOKEN }}
          # Per-service pins, resolved in the step above (GitHub Variable,
          # overridden by a tag dispatch for its own service). Rendered on every
          # run so no service's pin is lost when another one is deployed.
          ENCODER_REF: ${{ steps.target.outputs.encoder_ref }}
          MERGER_REF: ${{ steps.target.outputs.merger_ref }}
          STATS_REF: ${{ steps.target.outputs.stats_ref }}
        run: |
          umask 077
          # Fail fast: without MODEL_SERVICE_URL the runtime env would fall back to
          # the placeholder *.modal.run URL in .env.scaleway.example and deploy a
          # stack pointing at a bogus endpoint.
          if [ -z "${MODEL_SERVICE_URL:-}" ]; then
            echo "::error::MODEL_SERVICE_URL variable is not set — refusing to deploy against the placeholder endpoint."
            exit 1
          fi
          # No implicit default: an unset variable must not deploy an open API.
          case "${AUTH_TYPE:-}" in
            auth0|token|none) ;;
            *) echo "::error::AUTH_TYPE variable must be set to auth0, token or none (got '${AUTH_TYPE:-}')."; exit 1 ;;
          esac
          # Token auth without a token refuses to start in lux — fail here instead.
          if [ "$AUTH_TYPE" = "token" ] && [ -z "${API_TOKEN:-}" ]; then
            echo "::error::AUTH_TYPE=token but API_TOKEN secret is empty — set API_TOKEN."
            exit 1
          fi
          # Auth0 needs both identifiers; lux raises at startup otherwise — fail here.
          if [ "$AUTH_TYPE" = "auth0" ] && { [ -z "${AUTH0_DOMAIN:-}" ] || [ -z "${AUTH0_AUDIENCE:-}" ]; }; then
            echo "::error::AUTH_TYPE=auth0 requires the AUTH0_DOMAIN and AUTH0_AUDIENCE variables."
            exit 1
          fi
          # Only write keys that are actually set; appended after the committed
          # config template on the box, so these override its placeholders/defaults.
          : > .env.runtime
          for kv in \
            "MODEL_SERVICE_URL=$MODEL_SERVICE_URL" \
            "AUTH_TYPE=$AUTH_TYPE" \
            "CORS_ORIGINS=$CORS_ORIGINS" \
            "AUTH0_DOMAIN=$AUTH0_DOMAIN" \
            "AUTH0_AUDIENCE=$AUTH0_AUDIENCE" \
            "MODAL_KEY=$MODAL_KEY" \
            "MODAL_SECRET=$MODAL_SECRET" \
            "API_TOKEN=$API_TOKEN" \
            "SCW_ACCESS_KEY=$SCW_ACCESS_KEY" \
            "SCW_SECRET_KEY=$SCW_SECRET_KEY" \
            "OBSTRUCTION_SERVICE_URL=$OBSTRUCTION_SERVICE_URL" \
            "OBSTRUCTION_TOKEN=$OBSTRUCTION_TOKEN" \
            "ENCODER_REF=$ENCODER_REF" \
            "MERGER_REF=$MERGER_REF" \
            "STATS_REF=$STATS_REF"; do
            [ -n "${kv#*=}" ] && printf '%s\n' "$kv" >> .env.runtime
          done

      - name: Copy env and deploy over SSH
        env:
          HOST: ${{ vars.SCALEWAY_HOST }}
          USER_: ${{ vars.SCALEWAY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_REF: ${{ vars.DEPLOY_REF || 'master' }}
          BUILD: ${{ inputs.build }}
          FORCE_BUILD: ${{ steps.target.outputs.force_build }}
          COMPOSE_SERVICE: ${{ steps.target.outputs.compose_service }}
        run: |
          set -euo pipefail
          # Fail fast on missing connection config — clearer than a later SSH/cd error.
          : "${HOST:?SCALEWAY_HOST variable is not set}"
          : "${USER_:?SCALEWAY_USER variable is not set}"
          : "${DEPLOY_PATH:?DEPLOY_PATH variable is not set}"
          : "${DEPLOY_REF:?DEPLOY_REF resolved empty}"

          # $HOME (not ~) so the path stays absolute after variable expansion.
          # BatchMode=yes: never prompt (a bad key fails fast instead of hanging CI).
          # IdentitiesOnly=yes: use only id_deploy, don't try other identities and
          # trip the server's auth-attempt limit.
          ssh_opts="-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes"
          build_flag=""
          # A tag deploy's whole point is new code, so a resolved service_ref
          # forces the build regardless of the `build` checkbox.
          if [ "$BUILD" = "true" ] || [ "$FORCE_BUILD" = "true" ]; then
            build_flag="--build"
          fi
          service_flag=""
          [ -n "$COMPOSE_SERVICE" ] && service_flag="--service $COMPOSE_SERVICE"

          # 1. Stream the rendered secrets to a FIXED remote path. The command is
          #    single-quoted so $HOME expands on the box (not locally) and no
          #    GitHub-controlled value is interpolated into the remote command.
          #    `umask 077` makes the file 600 from the start (scp would use the
          #    remote login umask, often 644).
          ssh $ssh_opts "${USER_}@${HOST}" 'umask 077; cat > "$HOME/.lux_env.runtime"' < .env.runtime

          # 2. Run the remote deploy. DEPLOY_PATH/DEPLOY_REF/build_flag/service_flag
          #    are passed as %q-quoted env vars so they reach the box as DATA,
          #    never as code — a value containing quotes/semicolons can't break
          #    out and run commands. The script body (single-quoted heredoc)
          #    references them as variables.
          remote_env=$(printf 'DEPLOY_PATH=%q DEPLOY_REF=%q BUILD_FLAG=%q SERVICE_FLAG=%q' \
            "$DEPLOY_PATH" "$DEPLOY_REF" "$build_flag" "$service_flag")
          ssh $ssh_opts "${USER_}@${HOST}" "$remote_env bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch --all --prune
          git reset --hard "origin/$DEPLOY_REF"
          cd deployment
          umask 077
          cat .env.scaleway.example "$HOME/.lux_env.runtime" > .env.scaleway
          shred -u "$HOME/.lux_env.runtime" 2>/dev/null || rm -f "$HOME/.lux_env.runtime"
          bash deploy-scaleway.sh $BUILD_FLAG $SERVICE_FLAG
          REMOTE

      - name: Persist the deployed ref as a GitHub Variable
        # Only a run that pinned a ref has something new worth recording; a
        # manual run without one already deploys whatever the current pin
        # resolves to. Runs AFTER the deploy step and only on success, so the
        # Variable can never claim a ref that is not actually running.
        if: ${{ success() && steps.target.outputs.ref != '' }}
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_VARS_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF_VAR_NAME: ${{ steps.target.outputs.ref_var }}
          REF_VALUE: ${{ steps.target.outputs.ref }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::DEPLOY_VARS_TOKEN is not set. The pin was recorded on the box (services/.deployed-refs) but not as a GitHub Variable, so it will not survive the instance being rebuilt."
            exit 0
          fi
          # Deliberately non-fatal. The deploy itself already succeeded and the
          # on-box record already holds the pin, so failing the run here would
          # misreport a deploy that worked. The warning is the signal that
          # durable persistence degraded to the box-local record.
          # --env must match this job's `environment:` so the value is read back
          # by vars.<NAME>_REF on the next run.
          if gh variable set "$REF_VAR_NAME" --env prod --body "$REF_VALUE"; then
            echo "Recorded ${REF_VAR_NAME}=${REF_VALUE} (environment: prod)."
          else
            echo "::warning::Could not set ${REF_VAR_NAME}. Check DEPLOY_VARS_TOKEN's permission to write Actions variables for the prod environment. The pin is still recorded on the box."
          fi

      - name: Clean up local secrets
        if: always()
        run: shred -u .env.runtime 2>/dev/null || rm -f .env.runtime
