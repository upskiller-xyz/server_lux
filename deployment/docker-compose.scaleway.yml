# Scaleway deployment — Modal inference + internal-only microservices.
#
# Topology:
#   internet ──▶ nginx (the ONLY published service: 80/443)
#                  └─▶ server-lux ──▶ encoder / obstruction / merger / stats   (internal network only)
#                                 └─▶ MODEL_SERVICE_URL ──▶ Modal (GPU inference, off-box)
#
# Only nginx binds host ports. Every app service (including server-lux) is reachable
# ONLY on the internal `lux-network` bridge — never from the host or internet.
# Inference is no longer a container here; server-lux calls Modal over HTTPS and the
# proxy-auth headers are attached automatically (host ends in .modal.run).
#
# Usage:
#   cp .env.scaleway.example .env.scaleway   # fill in MODAL_* and SCW_* values
#   bash deploy-scaleway.sh --build
#
# Per-service resources are env-overridable. Obstruction is sized up: server-lux
# sends one request per window and the obstruction service computes all 64
# directions internally (vectorized CPU ray casting) — the heaviest CPU service.

services:
  # ── Public gateway: the only service with published ports ──────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: lux-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/cloudflare-ips.conf:/etc/nginx/snippets/cloudflare-ips.conf:ro
      # Behind Cloudflare: refuse connections that do not come from its edge.
      - ./nginx/origin-lock.conf:/etc/nginx/snippets/origin-lock.conf:ro
      # TLS certs for the 443 server block in nginx-docker.conf. Drop
      # origin.pem + origin.key into ./certs (git-ignored, never committed).
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      server-lux:
        condition: service_healthy
    # A size cap, not persistence: json-file has no max-size at all, so the
    # access log grows until the disk does. The log still dies with the
    # container on `--force-recreate` — shipping it off the box (the alloy
    # service below) is what makes it outlive a deploy.
    logging:
      driver: "local"
      options:
        max-size: "50m"
    networks:
      - lux-network

  # ── Orchestrator: internal only, reached via nginx ─────────────────────────
  server-lux:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: server-lux
    restart: unless-stopped
    labels:
      - "autoheal=true"
    # NOTE: no `ports:` — server-lux is internal; nginx is the public entrypoint.
    environment:
      - PORT=8080
      - DEPLOYMENT_MODE=production
      - WORKERS=${LUX_WORKERS:-2}
      - THREADS=${LUX_THREADS:-8}
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      # Internal service URLs (docker DNS names on lux-network)
      - ENCODER_SERVICE_URL=http://encoder-service:8082
      # Obstruction runs off-box as a private Scaleway Serverless Container (bursty
      # CPU-bound load — deployed separately from this stack, see server_obstruction).
      # The *.scw.cloud host is auto-detected and X-Auth-Token is attached from
      # the per-service token OBSTRUCTION_TOKEN. Keep OBSTRUCTION_MAX_CONCURRENCY
      # == the container's max-scale.
      - OBSTRUCTION_SERVICE_URL=${OBSTRUCTION_SERVICE_URL}
      - OBSTRUCTION_TOKEN=${OBSTRUCTION_TOKEN}
      - OBSTRUCTION_MAX_CONCURRENCY=${OBSTRUCTION_MAX_CONCURRENCY:-12}
      - MERGER_SERVICE_URL=http://merger-service:8084
      - STATS_SERVICE_URL=http://stats-service:8085
      # Inference on Modal — *.modal.run is auto-detected and gets proxy-auth.
      - MODEL_SERVICE_URL=${MODEL_SERVICE_URL}
      - MODAL_KEY=${MODAL_KEY}
      - MODAL_SECRET=${MODAL_SECRET}
      # Inbound auth for the public API — must be set explicitly (auth0|token|none).
      - AUTH_TYPE=${AUTH_TYPE:?AUTH_TYPE must be set explicitly (auth0|token|none)}
      - API_TOKEN=${API_TOKEN:-}
      # Comma-separated browser origins allowed to call the API (e.g. the web app).
      # Empty = allow every origin (logged as a warning at startup).
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Swagger UI / apispec off on the public gateway unless explicitly enabled.
      - API_DOCS_ENABLED=${API_DOCS_ENABLED:-false}
      # nginx overwrites X-Forwarded-For with the real client IP → trust one hop.
      - RATE_LIMIT_TRUSTED_PROXY_HOPS=${RATE_LIMIT_TRUSTED_PROXY_HOPS:-1}
      # Shared rolling-window quota counter. Defaults to the co-located Redis on
      # this box (shared across gunicorn workers); override with an external
      # Managed Redis rediss:// URL via .env.scaleway if you run multiple hosts.
      - RATE_LIMIT_REDIS_URL=${RATE_LIMIT_REDIS_URL:-redis://redis:6379}
    # Same deal as the gateway: a cap so the [call] lines cannot fill the disk.
    # Persistence comes from alloy pushing them to Cockpit, not from here.
    logging:
      driver: "local"
      options:
        max-size: "50m"
    env_file:
      - .env.scaleway
    depends_on:
      redis:
        condition: service_healthy
      encoder-service:
        condition: service_healthy
      merger-service:
        condition: service_healthy
      stats-service:
        condition: service_healthy
    networks:
      - lux-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "${LUX_CPUS:-2}"
          memory: ${LUX_MEM:-2g}

  # ── Rolling-window quota counter (daily rate limit) ─────────────────────────
  # Pure in-memory cache (no persistence): a restart just resets counters, which
  # is fine for a fair-use limit. Co-located so it is shared across gunicorn
  # workers. For multi-host, point RATE_LIMIT_REDIS_URL at a Managed Redis instead.
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - lux-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Obstruction: off-box as a private Scaleway Serverless Container ──────────
  # Moved off the VM — bursty CPU-bound load (64 directions/window) saturated the
  # instance's fixed cores. Deployed separately from this stack (see the
  # server_obstruction repo). server-lux reaches it via OBSTRUCTION_SERVICE_URL
  # (above), not lux-network.

  # ── Encoder: CPU rasterization ─────────────────────────────────────────────
  encoder-service:
    build:
      context: ./services/server_encoder
      dockerfile: Dockerfile
    container_name: encoder-service
    restart: unless-stopped
    labels:
      - "autoheal=true"
    environment:
      - PORT=8082
      - WORKERS=${ENCODER_WORKERS:-2}
      - THREADS=${ENCODER_THREADS:-4}
      - FLASK_ENV=production
    networks:
      - lux-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "${ENCODER_CPUS:-2}"
          memory: ${ENCODER_MEM:-2g}

  # ── Merger ─────────────────────────────────────────────────────────────────
  merger-service:
    build:
      context: ./services/server_merger
      dockerfile: Dockerfile
    container_name: merger-service
    restart: unless-stopped
    labels:
      - "autoheal=true"
    environment:
      - PORT=8084
      - WORKERS=${MERGER_WORKERS:-2}
      - THREADS=${MERGER_THREADS:-4}
      - FLASK_ENV=production
    networks:
      - lux-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "${MERGER_CPUS:-1}"
          memory: ${MERGER_MEM:-1g}

  # ── Stats ──────────────────────────────────────────────────────────────────
  stats-service:
    build:
      context: ./services/server_stats
      dockerfile: Dockerfile
    container_name: stats-service
    restart: unless-stopped
    labels:
      - "autoheal=true"
    environment:
      - PORT=8085
      - WORKERS=${STATS_WORKERS:-1}
      - THREADS=${STATS_THREADS:-4}
      - FLASK_ENV=production
    networks:
      - lux-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "${STATS_CPUS:-1}"
          memory: ${STATS_MEM:-1g}

  # ── Restart unhealthy containers automatically ─────────────────────────────
  autoheal:
    image: willfarrell/autoheal
    container_name: autoheal
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_START_PERIOD=120

  # ── Log shipping: every container's stdout → Scaleway Cockpit (OPTIONAL) ───
  # One agent for the whole box. It reads the Docker socket, tails each
  # container's log and pushes the lines to the project's Cockpit, where they
  # become queryable (LogQL) and graphable (Grafana) and survive both a
  # `--force-recreate` and the VM itself. No application change is involved:
  # the [call] records are already JSON on stdout and nginx already logs there.
  #
  # Off unless COMPOSE_PROFILES=cockpit is set in .env.scaleway — the deploy
  # script sources that file with `set -a`, so the profile reaches the
  # `docker compose up` calls that follow. Without it this service does not
  # exist and the stack behaves exactly as before.
  alloy:
    # Pinned like every other image here: an unpinned agent would change
    # version under us on an unrelated deploy.
    image: grafana/alloy:v1.20.1
    container_name: lux-alloy
    restart: unless-stopped
    profiles:
      - cockpit
    command:
      - run
      # Loopback only. Alloy's HTTP server is its own debug UI and needs no
      # reader here; binding 0.0.0.0 would publish it to every container on
      # the box.
      - --server.http.listen-addr=127.0.0.1:12345
      # Where the read positions live (see the volume below).
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      # Defaulted empty on purpose, NOT `:?`. Compose interpolates the whole
      # file before it applies profiles, so a required-variable guard here
      # would fail every deploy that does not set these — including the ones
      # that never start this service. Alloy refuses to load a config with an
      # empty endpoint URL, so the failure still surfaces immediately, but it
      # stays inside this container (`docker logs lux-alloy`) instead of
      # taking the whole stack's `up` with it.
      - COCKPIT_LOKI_URL=${COCKPIT_LOKI_URL:-}
      - COCKPIT_TOKEN=${COCKPIT_TOKEN:-}
    volumes:
      # NOTE: `:ro` protects the socket file, not the Docker API behind it —
      # anything that can reach this socket can control the daemon. That is the
      # standing cost of socket-based log collection (autoheal above already
      # pays it, read-write). Harden with a socket proxy if the box ever runs
      # anything less trusted than this stack.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read positions must outlive the container, or a restart re-ships every
      # line still held by Docker and you pay to ingest duplicates.
      - alloy-data:/var/lib/alloy/data
    logging:
      driver: "local"
      options:
        max-size: "10m"
    # Deliberately not on lux-network: the agent needs the socket and outbound
    # HTTPS to Cockpit, never a route to the services it collects from.

volumes:
  alloy-data:

networks:
  lux-network:
    driver: bridge
